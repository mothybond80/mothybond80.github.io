[project]
name = "decide-engine"
version = "0.1.1"
description = "Evidence-to-Decision Engine: framing-blind literature retrieval, citation verification and evidence packs for Claude Code and Hermes"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
test = ["pytest>=8"]

[project.scripts]
decide-engine = "decide_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["decide_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
