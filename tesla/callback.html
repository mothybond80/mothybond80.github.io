<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Tesla sign-in</title>
<style>
  body { margin: 0; padding: 40px 16px; font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: #f6f7f9; color: #1a1d21; }
  @media (prefers-color-scheme: dark) { body { background: #0f1216; color: #e8ebee; } }
  main { max-width: 520px; margin: 0 auto; }
  .error { color: #b3261e; }
</style>
</head>
<body>
<main>
  <h1 id="title">Finishing Tesla sign-in…</h1>
  <p id="lead">Handing the one-time code to the Mac mini over Tailscale. Nothing is stored on this page.</p>
  <p id="err" class="error" hidden></p>
</main>
<script>
  // Static hop: Tesla only accepts redirect URIs on a domain it can verify, and it
  // refuses Tailscale hostnames. This page forwards the one-time authorisation code
  // (plus the state the Mac generated) to the Mac mini's tailnet-only listener, which
  // exchanges it server-side. The target is fixed so this can never be an open redirect.
  (function () {
    var TARGET = "https://mac-mini-cowork.taila4414e.ts.net:8443/tesla/callback";
    var q = new URLSearchParams(location.search);
    var code = q.get("code"), state = q.get("state"), err = q.get("error");
    var e = document.getElementById("err");
    if (code && state) {
      location.replace(TARGET + "?code=" + encodeURIComponent(code) + "&state=" + encodeURIComponent(state));
      setTimeout(function () {
        e.textContent = "Still waiting. Check Tailscale is switched on on this phone, then reopen the sign-in link.";
        e.hidden = false;
      }, 8000);
    } else if (err) {
      document.getElementById("title").textContent = "Tesla sign-in failed";
      e.textContent = err + (q.get("error_description") ? ": " + q.get("error_description") : "");
      e.hidden = false;
    } else {
      document.getElementById("title").textContent = "Nothing to do";
      document.getElementById("lead").textContent = "Start from the sign-in link the Mac mini gives you.";
    }
  })();
</script>
</body>
</html>
