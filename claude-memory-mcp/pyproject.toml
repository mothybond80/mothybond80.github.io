[project]
name = "claude-memory-mcp"
version = "0.1.0"
description = "Hermes-style persistent memory and self-improving skills for Claude, served over MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",
    "uvicorn>=0.30",
]

[project.scripts]
claude-memory-mcp = "server:main"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
